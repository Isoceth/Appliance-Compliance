blueprint:
  name: Daylight-Aware Presence Light
  author: Isoceth
  description: >-
    Keeps a light on while a presence sensor reports someone there and the
    daylight is too poor, and switches it off when they leave.


    **Without a presence sensor** the automation never switches the light
    on or off: whoever switches it on starts the session, the light takes
    the schedule's colour and brightness at once and follows it while on,
    and switching it off ends the session. The daylight inputs then do
    nothing.


    **Daylight** comes from an illuminance sensor in the room when one is
    given. Because that sensor also sees the light it controls, its reading
    decides only whether to switch the light on; once on, the light stays on
    until presence ends.


    Without a sensor, or while its reading is unavailable or older than the
    light's last switch-off, daylight is an estimate of outdoor illuminance:
    a clear-sky figure from the sun's elevation, reduced for cloud cover
    (Kasten–Czeplak) and for rain, snow or fog from the weather entity. The
    light comes on when the estimate falls below the lower threshold and
    goes off once it rises above the upper one, so a bright day keeps it off
    and a dark, wet one keeps it on.


    **Colour and brightness** follow the clock rather than the sun, so an
    early winter sunset does not bring evening lighting at four in the
    afternoon. Day settings hold from the end of the morning ramp until
    wind-down, fade to the evening settings, then to the night settings,
    which hold until the next morning ramp.


    An optional colour timetable brings evening warmth forward while
    brightness keeps its own schedule. Both timetables follow the clock,
    so an early winter sunset does not bring night settings forward.


    **Manual control:** a change made to the light through Home Assistant
    (the UI, a voice assistant) during a session is left alone until the
    session ends. With a presence sensor, the end of presence always
    switches the light off, after the hold time.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    devices:
      name: Light and presence
      input:
        light_entity:
          name: Light
          selector:
            entity:
              domain: light
        presence_entity:
          name: Presence sensor (optional)
          description: >-
            On while someone is there. Any other state, including
            unavailable, counts as absent. Leave empty to have the light's
            own switching define the session.
          default: null
          selector:
            entity:
              domain: binary_sensor
        presence_hold_minutes:
          name: Hold after presence ends (minutes)
          description: >-
            How long the light stays on once the presence sensor stops
            reporting someone, so a motion sensor's quiet spells do not
            switch it off.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: box
    daylight:
      name: Daylight
      input:
        illuminance_entity:
          name: Illuminance sensor in the room (optional)
          default: null
          selector:
            entity:
              domain: sensor
              device_class: illuminance
        illuminance_on_below:
          name: Switch on below (lux, measured in the room)
          description: >-
            Compared with the sensor's reading while the light is off. A dim
            hallway might read 15–50 lux on a fair day and under 5 on a grim
            one.
          default: 10
          selector:
            number:
              min: 0
              max: 1000
              step: 1
              unit_of_measurement: lx
              mode: box
        weather_entity:
          name: Weather
          description: >-
            Supplies cloud cover (its `cloud_coverage` attribute, or the
            condition when that is missing) and rain, snow or fog to the
            outdoor estimate. Without one, the estimate assumes overcast.
          default: null
          selector:
            entity:
              domain: weather
        on_below_lux:
          name: Switch on below (lux, outdoors)
          description: >-
            For scale, with the sun 23° up: about 37,000 lux under a clear
            sky, 9,000 overcast, and 3,000 in heavy rain.
          default: 3000
          selector:
            number:
              min: 100
              max: 50000
              step: 100
              unit_of_measurement: lx
              mode: box
        off_above_lux:
          name: Switch off above (lux, outdoors)
          description: Keep this above the switch-on level so the light does not flap.
          default: 5000
          selector:
            number:
              min: 100
              max: 50000
              step: 100
              unit_of_measurement: lx
              mode: box
    schedule:
      name: Brightness and shared colour times
      description: >-
        Times must run in this order through the day. Colour follows these
        times unless separate evening colour times are enabled.
      collapsed: true
      input:
        morning_time:
          name: Morning ramp begins (night settings until here)
          default: "06:00:00"
          selector:
            time: {}
        day_time:
          name: Day settings reached
          default: "08:00:00"
          selector:
            time: {}
        wind_down_time:
          name: Wind-down begins (day settings until here)
          default: "19:00:00"
          selector:
            time: {}
        evening_time:
          name: Evening settings reached
          default: "21:30:00"
          selector:
            time: {}
        night_time:
          name: Night settings reached
          default: "23:30:00"
          selector:
            time: {}
    colour_schedule:
      name: Separate evening colour times
      description: >-
        Warm the light earlier without dimming it earlier. Times must run
        in order after the day settings are reached. Morning times and
        colour temperatures come from the main schedule and settings.
      collapsed: true
      input:
        separate_colour_schedule:
          name: Use separate evening colour times
          default: false
          selector:
            boolean: {}
        colour_wind_down_time:
          name: Colour wind-down begins
          default: "17:00:00"
          selector:
            time: {}
        colour_evening_time:
          name: Evening colour reached
          default: "19:00:00"
          selector:
            time: {}
        colour_night_time:
          name: Night colour reached
          default: "20:30:00"
          selector:
            time: {}
    settings:
      name: Colour and brightness
      description: The light clamps colour temperatures to the range it supports.
      collapsed: true
      input:
        day_kelvin:
          name: Day colour temperature
          default: 4000
          selector: &kelvin
            number:
              min: 1500
              max: 6500
              step: 50
              unit_of_measurement: K
              mode: slider
        day_brightness:
          name: Day brightness
          default: 100
          selector: &percent
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
        evening_kelvin:
          name: Evening colour temperature
          default: 2700
          selector: *kelvin
        evening_brightness:
          name: Evening brightness
          default: 75
          selector: *percent
        night_kelvin:
          name: Night colour temperature
          default: 2200
          selector: *kelvin
        night_brightness:
          name: Night brightness
          default: 40
          selector: *percent
        fade_on_seconds:
          name: Switch-on fade
          description: How long the light takes to fade up when the automation switches it on.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 1
              unit_of_measurement: s
              mode: slider

mode: queued
max: 5
max_exceeded: silent

trigger_variables:
  light_entity: !input light_entity
  presence_entity: !input presence_entity

# Presence is optional, so it is watched through templates; a state trigger
# cannot take an empty entity.
triggers:
  - trigger: template
    value_template: "{{ presence_entity is not none and is_state(presence_entity, 'on') }}"
    id: arrived
  - trigger: template
    value_template: "{{ presence_entity is not none and not is_state(presence_entity, 'on') }}"
    for:
      minutes: !input presence_hold_minutes
    id: left
  - trigger: state
    entity_id: !input light_entity
    to: "on"
    id: turned_on
    enabled: "{{ presence_entity is none }}"
  - trigger: time_pattern
    minutes: "/5"
    id: tick
  - trigger: homeassistant
    event: start
    id: tick

variables:
  illuminance_entity: !input illuminance_entity
  illuminance_on_below: !input illuminance_on_below
  weather_entity: !input weather_entity
  on_below_lux: !input on_below_lux
  off_above_lux: !input off_above_lux
  fade_on_seconds: !input fade_on_seconds
  separate_colour_schedule: !input separate_colour_schedule
  schedule:
    - at: !input morning_time
      kelvin: !input night_kelvin
      brightness: !input night_brightness
    - at: !input day_time
      kelvin: !input day_kelvin
      brightness: !input day_brightness
    - at: !input wind_down_time
      kelvin: !input day_kelvin
      brightness: !input day_brightness
    - at: !input evening_time
      kelvin: !input evening_kelvin
      brightness: !input evening_brightness
    - at: !input night_time
      kelvin: !input night_kelvin
      brightness: !input night_brightness
  colour_schedule:
    - at: !input morning_time
      kelvin: !input night_kelvin
    - at: !input day_time
      kelvin: !input day_kelvin
    - at: !input colour_wind_down_time
      kelvin: !input day_kelvin
    - at: !input colour_evening_time
      kelvin: !input evening_kelvin
    - at: !input colour_night_time
      kelvin: !input night_kelvin

actions:
  - if:
      - condition: trigger
        id: left
    then:
      - action: light.turn_off
        target:
          entity_id: "{{ light_entity }}"
        data:
          transition: 3
      - stop: Presence ended
  # A session runs while presence is on or, without a presence sensor, while
  # the light is on.
  - condition: template
    value_template: >-
      {{ is_state(presence_entity, 'on') if presence_entity
         else is_state(light_entity, 'on') }}
  - variables:
      # A change carrying a user (the UI, a voice assistant) made after the
      # session began is someone's choice; the light is left alone until the
      # session ends. Switching the light on is what begins a session without
      # presence, so that change does not count.
      manual_override: >-
        {% set light = states[light_entity] %}
        {% set session = states[presence_entity] if presence_entity else light %}
        {{ light is not none and session is not none
           and light.context.user_id is not none
           and light.last_updated > session.last_changed }}
  - condition: template
    value_template: "{{ not manual_override }}"
  - variables:
      outdoor_lux: >-
        {% set elevation = state_attr('sun.sun', 'elevation') | float(-90) %}
        {% if elevation < -6 %}
          0
        {% else %}
          {# Clear-sky illuminance from solar elevation, with an air-mass term. #}
          {% set u = sin(elevation * pi / 180) %}
          {% set x = 753.66156 %}
          {% set s = asin(x * cos(elevation * pi / 180) / (x + 1)) %}
          {% set air_mass = x * (cos(s) - u) + cos(s) %}
          {% set clear_sky = 133775 * (e ** (-0.2 * air_mass) * u
               + 0.0289 * e ** (-0.042 * air_mass)
                 * (1 + (elevation + 90) * u / 57.29577951)) %}
          {% set condition = states(weather_entity) if weather_entity else 'unknown' %}
          {% set cover = state_attr(weather_entity, 'cloud_coverage') if weather_entity else none %}
          {% if cover is none %}
            {% set cover = {'sunny': 0, 'clear-night': 0, 'windy': 25,
                            'partlycloudy': 50, 'windy-variant': 50}.get(condition, 100) %}
          {% endif %}
          {% set cloud = 1 - 0.75 * ((cover | float(100)) / 100) ** 3.4 %}
          {% set weather = {'rainy': 0.6, 'snowy': 0.6, 'lightning': 0.6,
                            'snowy-rainy': 0.5, 'hail': 0.5, 'fog': 0.5,
                            'exceptional': 0.5, 'pouring': 0.35,
                            'lightning-rainy': 0.35}.get(condition, 1) %}
          {{ [clear_sky * cloud * weather, 0] | max | round(0) }}
        {% endif %}
      light_is_on: "{{ is_state(light_entity, 'on') }}"
      # The room sensor's reading counts only while it is a number and was
      # reported after the light last changed, so it does not include the
      # light's own output.
      measured_lux: >-
        {% set sensor = states[illuminance_entity] if illuminance_entity else none %}
        {% set light = states[light_entity] %}
        {% if sensor is none or not is_number(sensor.state)
              or (light is not none and sensor.last_reported < light.last_changed) %}
          {{ none }}
        {% else %}
          {{ sensor.state | float }}
        {% endif %}
      light_needed: >-
        {% if not presence_entity %}
          {{ light_is_on }}
        {% elif illuminance_entity and light_is_on %}
          {{ true }}
        {% elif measured_lux is not none %}
          {{ measured_lux < illuminance_on_below }}
        {% else %}
          {{ outdoor_lux < on_below_lux
             or (light_is_on and outdoor_lux < off_above_lux) }}
        {% endif %}
      lighting: >-
        {% set n = now() %}
        {% set minute = n.hour * 60 + n.minute + n.second / 60 %}
        {% set ns = namespace(kelvin=0, brightness=0) %}
        {% for setting in ['kelvin', 'brightness'] %}
          {% set points = colour_schedule
               if setting == 'kelvin' and separate_colour_schedule else schedule %}
          {% for i in range(points | length) %}
            {% set a = points[i] %}
            {% set z = points[(i + 1) % (points | length)] %}
            {% set a_parts = a.at.split(':') %}
            {% set z_parts = z.at.split(':') %}
            {% set start = a_parts[0] | int * 60 + a_parts[1] | int %}
            {% set end = z_parts[0] | int * 60 + z_parts[1] | int %}
            {% if end <= start %}{% set end = end + 1440 %}{% endif %}
            {% set at = minute if minute >= start else minute + 1440 %}
            {% if start <= at < end %}
              {% set f = (at - start) / (end - start) %}
              {% set value = a[setting] + (z[setting] - a[setting]) * f %}
              {% if setting == 'kelvin' %}
                {% set ns.kelvin = value %}
              {% else %}
                {% set ns.brightness = value %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ {'kelvin': ns.kelvin | round(0) | int,
            'brightness': ns.brightness | round(0) | int} }}
  - if:
      - condition: template
        value_template: "{{ light_needed }}"
    then:
      - if:
          - condition: template
            value_template: "{{ light_is_on }}"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: "{{ lighting.kelvin }}"
              brightness_pct: "{{ lighting.brightness }}"
              transition: "{{ 1 if trigger.id == 'turned_on' else 10 }}"
        # Switching on takes the colour at the lowest brightness, then fades up
        # on brightness alone: Zigbee2MQTT drops the brightness transition for
        # IKEA bulbs when the same command sets colour temperature. The pause
        # lets the colour command reach the bulb first, because Zigbee2MQTT
        # can interleave two messages, and a colour command arriving
        # mid-fade cancels an IKEA bulb's fade.
        else:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: "{{ lighting.kelvin }}"
              brightness: 1
              transition: 0
          - delay:
              seconds: 1
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_pct: "{{ lighting.brightness }}"
              transition: "{{ fade_on_seconds }}"
    else:
      - if:
          - condition: template
            value_template: "{{ light_is_on }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ light_entity }}"
            data:
              transition: 10
